[project]
name = "lapsula-bookings-mcp"
version = "1.1.0"
description = "Connect Lapsula Bookings to ChatGPT, Claude and any AI agent through Cotlet.dev, a hosted MCP server. No Lapsula Bookings API key needed."
readme = "README.md"
license = "Elastic-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Cotlet.dev", email = "contact@cotlet.dev" }]
keywords = ["lapsula bookings", "lapsula bookings api", "lapsula bookings mcp", "mcp server", "claude", "chatgpt", "ai agent", "cotlet"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Office/Business"]
dependencies = []

[project.urls]
Homepage = "https://cotlet.dev/integrations/lapsula-bookings-api-mcp-server?utm_source=pypi&utm_medium=package&utm_campaign=lapsula-bookings"
Source = "https://github.com/cotlet-connect/lapsula-bookings-mcp"

[project.scripts]
lapsula-bookings-mcp = "lapsula_bookings_agent:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"lapsula_bookings_agent.py" = "lapsula_bookings_agent.py"

[tool.hatch.build.targets.sdist]
include = ["lapsula_bookings_agent.py", "README.md", "LICENSE", "mcp.json", "Dockerfile", "glama.json", "skills", "examples", ".cursor"]
